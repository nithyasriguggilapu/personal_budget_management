{% extends "auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block auth_content %}
<h2>Welcome back</h2>
<p class="auth-card-intro">Log in to view and manage your personal budget.</p>
<form class="auth-form" method="post" action="{{ url_for('login_post') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next_url or '' }}">
  <label for="identifier">Email or username
    <input id="identifier" name="identifier" type="text" value="{{ request.form.get('identifier', '') }}" autocomplete="username" maxlength="254" required autofocus>
  </label>
  <label for="password">Password
    <span class="auth-password">
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="password-toggle" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false">Show</button>
    </span>
  </label>
  <div class="auth-options">
    <label class="auth-check"><input name="remember_me" type="checkbox"> Remember me</label>
    <a class="auth-link" href="{{ url_for('forgot_password') }}">Forgot password?</a>
  </div>
  <button class="button button-primary auth-submit" type="submit">Log in</button>
</form>
<p class="auth-switch">New to Personal Budget? <a href="{{ url_for('register') }}">Create an account</a></p>
<p class="auth-security-note"><span aria-hidden="true">●</span> Your password is stored securely as a one-way hash.</p>
{% endblock %}
